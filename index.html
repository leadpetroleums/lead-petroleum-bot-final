<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Petroleum AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', 'Roboto', sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #d4b52e;
            padding: 30px;
            border-radius: 8px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .chat-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            gap: 15px;
        }
        
        .messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            min-height: 300px;
        }
        
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
        }
        
        .user-message {
            align-self: flex-end;
            background: #1a1a2e;
            color: white;
            border-bottom-right-radius: 0;
        }
        
        .bot-message {
            align-self: flex-start;
            background: #e8e8e8;
            color: #333;
            border-bottom-left-radius: 0;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        
        button {
            padding: 12px 24px;
            background: #d4b52e;
            color: #0a0a0a;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #c4a520;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #d4b52e;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Lead Petroleum AI Assistant</h1>
            <p>Ask questions about our lubricant products</p>
        </div>
        
        <div class="chat-box">
            <div class="messages" id="messages">
                <div class="bot-message">
                    Hello! I'm the Lead Petroleum AI Assistant. Ask me anything about our lubricant products, and I'll help you find the right solution.
                </div>
            </div>
            
            <div class="input-group">
                <input 
                    type="text" 
                    id="queryInput" 
                    placeholder="e.g., What oil for diesel trucks?" 
                    onkeypress="handleKeyPress(event)"
                >
                <button onclick="sendMessage()" id="sendBtn">Send</button>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = window.location.origin + '/api/chat';
        
        async function sendMessage() {
            const input = document.getElementById('queryInput');
            const query = input.value.trim();
            
            if (!query) return;
            
            // Add user message
            addMessage(query, 'user');
            input.value = '';
            
            // Disable button and show loading
            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            
            try {
                // Add loading message
                const loadingId = 'loading-' + Date.now();
                addMessage('<div class="loading"></div> Thinking...', 'bot', loadingId);
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, stream: false })
                });
                
                // Remove loading message
                const loadingEl = document.getElementById(loadingId);
                if (loadingEl) loadingEl.remove();
                
                if (!response.ok) {
                    addMessage('Error: Unable to process your request. Please try again.', 'bot');
                    return;
                }
                
                const data = await response.json();
                addMessage(data.text, 'bot');
                
            } catch (error) {
                addMessage('Error: Unable to connect to the server. Please try again.', 'bot');
                console.error(error);
            } finally {
                btn.disabled = false;
                input.focus();
            }
        }
        
        function addMessage(text, type, id = null) {
            const messagesDiv = document.getElementById('messages');
            const msgEl = document.createElement('div');
            msgEl.className = `message ${type}-message`;
            msgEl.innerHTML = text;
            if (id) msgEl.id = id;
            messagesDiv.appendChild(msgEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        // Focus input on load
        document.getElementById('queryInput').focus();
    </script>
</body>
</html>
